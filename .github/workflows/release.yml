name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install rsrc (resource compiler)
        run: go install github.com/akavel/rsrc@latest

      - name: Embed icon into the exe
        run: rsrc -ico icon.ico -o tail-split.syso

      - name: Build tail-split.exe (windows/amd64)
        run: |
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags="-s -w -H windowsgui -X main.buildVersion=${{ github.ref_name }}" -o tail-split.exe .

      - name: Package zip
        run: Compress-Archive -Path tail-split.exe, README.md -DestinationPath tail-split-${{ github.ref_name }}-windows-amd64.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} `
            tail-split.exe `
            tail-split-${{ github.ref_name }}-windows-amd64.zip `
            --title "tail-split ${{ github.ref_name }}" `
            --generate-notes
